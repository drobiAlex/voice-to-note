[project]
name = "voice-to-note"
version = "0.1.0"
description = "Local voice memo -> transcript -> speakers -> structured notes"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vtn = "voice_to_note.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_note"]
