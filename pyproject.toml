[project]
name = "voice-to-note"
version = "0.1.0"
description = "Local voice memo -> transcript -> speakers -> structured notes"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "sherpa-onnx>=1.13.4",
    "sherpa-onnx-core==1.13.4",
    "textual==8.2.8",
]

[project.scripts]
vtn = "voice_to_note.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI's sherpa-onnx macOS wheel lacks the bundled onnxruntime dylib;
# the k2-fsa flat index ships complete wheels.
[[tool.uv.index]]
name = "k2-fsa-sherpa-onnx"
url = "https://k2-fsa.github.io/sherpa/onnx/cpu.html"
format = "flat"
explicit = true

[tool.uv.sources]
sherpa-onnx = { index = "k2-fsa-sherpa-onnx" }
sherpa-onnx-core = { index = "k2-fsa-sherpa-onnx" }

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_note"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
testpaths = ["tests"]
# the 207 Textual Pilot tests each boot a whole app and dominate the wall clock;
# spreading them over the cores turns a four-minute suite into a two-minute one,
# and `-n0` still puts a single test back on one process for debugging
addopts = "-n auto"
markers = [
    "ui: TUI Pilot tests",
]

[tool.mypy]
files = ["src"]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

# sherpa-onnx ships no type information; the rest of the tree stays checked
[[tool.mypy.overrides]]
module = "sherpa_onnx.*"
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
