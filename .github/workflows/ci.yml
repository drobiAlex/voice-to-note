name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # every tool runs from the synced environment, so the pinned versions in
      # pyproject are the single place any of them can change
      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run mypy src

      # the floor sits ~2 points under the measured 86.81%, so ordinary churn
      # does not fail CI but a real drop in covered behavior does
      - name: Test
        run: uv run pytest -q --cov=voice_to_note --cov-fail-under=84
