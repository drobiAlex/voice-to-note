name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uvx ruff@0.16.2 check src tests

      # unlike ruff, mypy has to see the project's dependencies to resolve
      # imports, so it runs inside the synced environment rather than via uvx
      - name: Types
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q
