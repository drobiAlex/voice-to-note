<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">voice-to-note: three pillars</title>
  <desc id="d">Three panels. Local voice to notes: a waveform becomes a note with a checkbox, on your Mac. A TUI for you: a miniature terminal with a sidebar and list rows. A CLI for agents: the command vtn notes 3 --json and JSON output.</desc>
  <rect width="1200" height="420" rx="20" fill="#0d1117"/>
  <text x="60" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#58a6ff">voice-to-note</text>

  <!-- panel 1 -->
  <rect x="60" y="76" width="340" height="304" rx="14" fill="#161b22" stroke="#30363d"/>
  <g fill="#58a6ff">
    <rect x="84" y="156" width="6" height="18" rx="3"/>
    <rect x="98" y="140" width="6" height="50" rx="3"/>
    <rect x="112" y="122" width="6" height="86" rx="3"/>
    <rect x="126" y="146" width="6" height="38" rx="3"/>
    <rect x="140" y="130" width="6" height="70" rx="3"/>
    <rect x="154" y="150" width="6" height="30" rx="3"/>
    <rect x="168" y="138" width="6" height="54" rx="3"/>
    <rect x="182" y="156" width="6" height="18" rx="3"/>
  </g>
  <path d="M204 165h26m-8-8l8 8l-8 8" fill="none" stroke="#9da7b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="246" y="108" width="128" height="114" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="262" y="128" width="16" height="16" rx="3" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M265 136l4 4l6-8" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="288" y="132" width="70" height="8" rx="4" fill="#9da7b3"/>
  <rect x="262" y="160" width="16" height="16" rx="3" fill="none" stroke="#6e7681" stroke-width="2.5"/>
  <rect x="288" y="164" width="52" height="8" rx="4" fill="#6e7681"/>
  <rect x="262" y="192" width="96" height="8" rx="4" fill="#6e7681"/>
  <!-- lock: on-device cue -->
  <g fill="none" stroke="#9da7b3" stroke-width="2.5">
    <path d="M360 92v-6a7 7 0 0 1 14 0v6"/>
    <rect x="356" y="92" width="22" height="16" rx="3" fill="#9da7b3" stroke="none"/>
  </g>
  <text x="80" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Local voice to notes</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a8b3bf">
    <text x="80" y="308">Record or drop in a file.</text>
    <text x="80" y="332">Whisper and speaker separation</text>
    <text x="80" y="356">run on your Mac.</text>
  </g>

  <!-- panel 2 -->
  <rect x="430" y="76" width="340" height="304" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="450" y="104" width="300" height="130" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="468" cy="120" r="4" fill="#6e7681"/>
  <circle cx="482" cy="120" r="4" fill="#6e7681"/>
  <circle cx="496" cy="120" r="4" fill="#6e7681"/>
  <path d="M451 134h298M530 134v99" stroke="#30363d" stroke-width="2"/>
  <g fill="#6e7681">
    <rect x="462" y="148" width="54" height="8" rx="4"/>
    <rect x="462" y="170" width="44" height="8" rx="4"/>
    <rect x="462" y="192" width="50" height="8" rx="4"/>
    <rect x="462" y="214" width="38" height="8" rx="4"/>
  </g>
  <rect x="540" y="142" width="200" height="22" rx="5" fill="#58a6ff" fill-opacity="0.22"/>
  <rect x="550" y="149" width="120" height="8" rx="4" fill="#58a6ff"/>
  <g fill="#9da7b3">
    <rect x="550" y="176" width="150" height="8" rx="4"/>
    <rect x="550" y="196" width="110" height="8" rx="4"/>
    <rect x="550" y="216" width="132" height="8" rx="4"/>
  </g>
  <text x="450" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">A TUI for you</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a8b3bf">
    <text x="450" y="308">Browse, edit and process</text>
    <text x="450" y="332">every memo on one screen.</text>
  </g>

  <!-- panel 3 -->
  <rect x="800" y="76" width="340" height="304" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="820" y="104" width="300" height="130" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="838" y="136"><tspan fill="#58a6ff">$</tspan><tspan fill="#e6edf3"> vtn notes 3 --json</tspan></text>
    <text x="838" y="164" fill="#9da7b3">{ "action_items": [</text>
  </g>
  <g fill="#6e7681">
    <rect x="862" y="178" width="120" height="8" rx="4"/>
    <rect x="862" y="196" width="90" height="8" rx="4"/>
  </g>
  <text x="838" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#9da7b3">] }</text>
  <text x="820" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">A CLI for agents</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a8b3bf">
    <text x="820" y="308">Plain commands, JSON out.</text>
    <text x="820" y="332">Built for Claude and friends</text>
    <text x="820" y="356">to drive.</text>
  </g>
</svg>
